name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-materials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -p test_check_release.py -v
      - run: python -B scripts/check_release.py

  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s tests -p test_prepare_native.py -v
      - run: python -B -m unittest discover -s tests -p test_release_helpers.py -v
      - run: zsh -n scripts/install_map_tunnel.command
      - name: Assemble pinned upstream without game inputs
        run: python -B scripts/prepare_native.py --work "$RUNNER_TEMP/native-adventure"
      - name: Verify reconstructed source
        run: |
          python -B scripts/prepare_native.py --work "$RUNNER_TEMP/native-adventure" --verify
          python -B "$RUNNER_TEMP/native-adventure/MacNativeGames/games/totk/scripts/check_repository.py"
      - name: Run native host regressions
        run: |
          python -m pip install -r "$RUNNER_TEMP/native-adventure/MacNativeGames/games/totk/requirements.txt"
          python -B -m unittest discover -s "$RUNNER_TEMP/native-adventure/MacNativeGames/tests"

  map-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r map-client/backend/requirements.txt
      - run: python -B -m unittest discover -s tests -p test_map_client_shell.py -v
      - name: Check frontend JavaScript
        run: find map-client/webui -name '*.js' -exec node --check {} \;
